worker_processes auto;
events { worker_connections 4096; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  gzip on;
  gzip_types application/json text/css application/javascript image/svg+xml;
  resolver 127.0.0.11 valid=10s;
  upstream havie_backend {
    zone havie_backend 64k;
    least_conn;
    server api:3000 resolve;
    keepalive 32;
  }
  server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 10m;
    location /api/ {
      proxy_pass http://havie_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 360s;
      proxy_cache off;
      # OAuth codes, payment query parameters and account URLs stay out of logs.
      access_log off;
    }
    location /uploads/ { proxy_pass http://havie_backend; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
  }
}
